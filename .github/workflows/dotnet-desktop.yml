name: Build .NET 9 MAUI App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui-windows

    - name: Restore Dependencies
      run: dotnet restore CampusActivitiesManager/CampusActivitiesManager/CampusActivitiesManager.csproj

    - name: Build Project (Windows Desktop)
      run: dotnet build CampusActivitiesManager/CampusActivitiesManager/CampusActivitiesManager.csproj -c Release -f net9.0-windows10.0.19041.0 --no-restore
